[project]
name = "workflow-backend"
version = "1.0.0"
description = "Enterprise workflow (ringi / approval) SaaS backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "email-validator>=2.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = ["error::DeprecationWarning:app.*"]
markers = [
    "scenario: 業務シナリオを通しで検証するテスト（法人単位でデータを分離）",
]

[tool.ruff]
# Japanese identifiers and messages make lines wider than an English codebase.
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves relationship targets from string annotations.
"app/models/*.py" = ["UP037"]
# `Depends(...)`/`Query(...)` in defaults is the FastAPI idiom.
"app/api/*.py" = ["B008"]
"app/api/routers/*.py" = ["B008"]
# Settings must be overridden before the application modules are imported.
"tests/conftest.py" = ["E402", "I001"]
# Demo fixtures are prose-heavy data literals; wrapping them hurts readability.
"app/seed.py" = ["E501"]
